# Local stack: API + MLflow + Prometheus (with alert rules) + Grafana (pre-provisioned dashboard).
# Run `make train` first so artifacts/model.joblib exists, then `make up`.
services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DRIFT_MIN_SAMPLES: "50"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.4.0
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]

  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
