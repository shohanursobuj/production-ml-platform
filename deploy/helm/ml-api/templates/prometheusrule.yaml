{{- if .Values.monitoring.prometheusRule }}
# Generated from monitoring/alerts.yml (make helm-rules). Do not edit by hand.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ml-api.fullname" . }}
  labels:
    {{- include "ml-api.labels" . | nindent 4 }}
spec:
  groups:
    - name: ml-api-slo
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(ml_api_requests_total{path="/predict",status=~"5.."}[5m]))
              / clamp_min(sum(rate(ml_api_requests_total{path="/predict"}[5m])), 1e-9) > 0.01
          for: 5m
          labels: {severity: page}
          annotations:
            summary: "/predict error rate above 1% SLO"
            runbook: "README.md#runbook"

        - alert: HighInferenceLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(ml_api_inference_seconds_bucket[5m]))) > 0.05
          for: 10m
          labels: {severity: ticket}
          annotations:
            summary: "p95 inference latency above 50ms"
            runbook: "README.md#runbook"

    - name: ml-api-model-quality
      rules:
        - alert: FeatureDrift
          expr: max by (feature) (ml_api_feature_drift_psi) > 0.2
          for: 15m
          labels: {severity: ticket}
          annotations:
            summary: "PSI {{ "{{" }} $value | printf \"%.2f\" {{ "}}" }} on {{ "{{" }} $labels.feature {{ "}}" }}: live traffic has shifted from training data"
            runbook: "README.md#runbook"

        - alert: PredictionMixShift
          expr: |
            sum(rate(ml_api_predictions_total{label="positive"}[1h]))
              / clamp_min(sum(rate(ml_api_predictions_total[1h])), 1e-9) > 0.8
          for: 30m
          labels: {severity: ticket}
          annotations:
            summary: "Over 80% of predictions positive for 30m (training base rate is ~50%)"
            runbook: "README.md#runbook"
{{- end }}
