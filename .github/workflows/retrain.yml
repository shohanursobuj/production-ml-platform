# Retraining loop. Triggered on a schedule, by hand, or by a drift alert
# (Alertmanager -> small webhook relay -> repository_dispatch "drift-detected").
# A candidate that passes the gate is proposed as a pull request that updates
# models/champion.json, so every promotion is reviewed and auditable in git history.
name: retrain

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [drift-detected]

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONPATH: src

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/train.txt
      - name: Train candidate
        run: python -m mlplatform.train
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Gate against champion
        run: python -m mlplatform.evaluate --candidate artifacts/metrics.json --champion models/champion.json | tee gate.txt
      - name: Stage promotion
        id: candidate
        run: |
          cp artifacts/metrics.json models/champion.json
          echo "version=$(python3 -c "import json; print(json.load(open('models/champion.json'))['model_version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: artifacts/
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: retrain/${{ github.run_id }}
          title: "Promote model ${{ steps.candidate.outputs.version }}"
          commit-message: "Promote model ${{ steps.candidate.outputs.version }}"
          add-paths: models/champion.json
          body-path: gate.txt
