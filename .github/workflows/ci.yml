name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  train-and-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/train.txt
      - name: Train
        run: python -m mlplatform.train
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Evaluation gate (thresholds + no regression vs champion)
        run: python -m mlplatform.evaluate --candidate artifacts/metrics.json --champion models/champion.json
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: artifacts/

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint (Deployment and canary modes)
        run: |
          helm lint deploy/helm/ml-api --strict
          helm lint deploy/helm/ml-api --strict \
            --set canary.enabled=true,monitoring.serviceMonitor=true,monitoring.prometheusRule=true
      - name: PrometheusRule is in sync with monitoring/alerts.yml
        run: python3 scripts/gen_helm_rules.py && git diff --exit-code
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  e2e-kind:
    needs: train-and-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/
      - run: docker build -t ml-api:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - uses: azure/setup-helm@v4
      - name: Deploy chart into kind
        run: |
          kind load docker-image ml-api:ci --name ci
          helm install ml-api deploy/helm/ml-api \
            --set image.repository=ml-api,image.tag=ci,image.pullPolicy=Never \
            --set autoscaling.enabled=false,replicaCount=1 \
            --wait --timeout 3m
      - name: Smoke test through the Service
        run: |
          kubectl port-forward svc/ml-api-ml-api 8080:80 &
          for i in $(seq 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          curl -sf -X POST localhost:8080/predict -H 'Content-Type: application/json' \
            -d '{"texts": ["a warm, funny and beautifully made film", "a dull and lifeless mess"]}' | tee out.json
          python3 -c "import json; p=json.load(open('out.json'))['predictions']; assert [x['label'] for x in p]==['positive','negative'], p"
          curl -sf localhost:8080/metrics | grep -E '^ml_api_(inference_seconds_count|model_info)'
      - name: Debug on failure
        if: failure()
        run: kubectl get pods -o wide && kubectl describe pods && kubectl logs -l app.kubernetes.io/name=ml-api --tail=100

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e-kind, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/
      - id: model
        run: echo "version=$(python3 -c "import json; print(json.load(open('artifacts/metrics.json'))['model_version'])")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            ml.model.version=${{ steps.model.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
