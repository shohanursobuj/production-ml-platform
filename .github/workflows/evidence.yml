# Runs the full local stack on a GitHub runner, drives normal then drifted traffic until the
# FeatureDrift alert genuinely fires, and captures screenshots of Grafana, Prometheus, MLflow
# and the CI pipeline. The images are uploaded as the "evidence" artifact of the run.
name: evidence

on:
  workflow_dispatch:
    inputs:
      normal_minutes:
        description: Minutes of normal traffic before the drift starts
        default: "5"
      max_wait_minutes:
        description: Give up if FeatureDrift (for 15m) has not fired after this long
        default: "25"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: src

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/tracking.txt playwright==1.63.0
      - run: python -m playwright install --with-deps chromium

      - name: Start MLflow
        run: |
          docker compose up -d mlflow
          for i in $(seq 60); do curl -sf localhost:5000/health && break; sleep 2; done

      - name: Train (tracked in MLflow) and gate
        run: |
          python -m mlplatform.train
          python -m mlplatform.evaluate --candidate artifacts/metrics.json --champion models/champion.json | tee gate.txt
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
          GIT_SHA: ${{ github.sha }}

      - name: Start API, Prometheus, Grafana
        run: |
          docker compose up -d --build api prometheus grafana
          for i in $(seq 60); do curl -sf localhost:8080/readyz && break; sleep 2; done
          for i in $(seq 60); do curl -sf localhost:3000/api/health && break; sleep 2; done

      - name: Normal traffic
        run: |
          end=$((SECONDS + ${{ inputs.normal_minutes }} * 60))
          while [ $SECONDS -lt $end ]; do python scripts/loadgen.py --requests 50 > /dev/null; done
          curl -s localhost:8080/metrics | grep '^ml_api_feature_drift_psi'

      - name: Drifted traffic until FeatureDrift fires
        run: |
          (while true; do python scripts/loadgen.py --requests 50 --drift > /dev/null; done) &
          end=$((SECONDS + ${{ inputs.max_wait_minutes }} * 60))
          until curl -s localhost:9090/api/v1/alerts | python3 -c '
          import json, sys
          alerts = json.load(sys.stdin)["data"]["alerts"]
          sys.exit(0 if any(a["labels"]["alertname"] == "FeatureDrift" and a["state"] == "firing" for a in alerts) else 1)'; do
            [ $SECONDS -ge $end ] && { echo "FeatureDrift did not fire in time"; exit 1; }
            sleep 20
          done
          echo "FeatureDrift is firing"
          curl -s localhost:8080/metrics | grep '^ml_api_feature_drift_psi'

      - name: Capture screenshots
        run: |
          ci_run=$(gh run list --workflow ci.yml --status success --limit 1 --json url -q '.[0].url')
          python scripts/capture_evidence.py --out evidence --ci-run-url "$ci_run"
          cp gate.txt artifacts/metrics.json evidence/
          curl -s localhost:8080/metrics | grep '^ml_api_' > evidence/metrics.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: evidence/

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
